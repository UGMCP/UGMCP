<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unit Agent</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/unit_agent.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/unit_agent.png" />
    <script>
      try {
        var theme = localStorage.getItem("unit-agent-theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
